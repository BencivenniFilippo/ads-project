services:
  server1:
    image: ads/server
    build:
      context: .
      dockerfile: server.Dockerfile
    environment:
      SERVER_NAME: "server1"
      RPC_PORT: "7777"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
    depends_on:
      - cache

  server2:
    image: ads/server
    environment:
      SERVER_NAME: "server2"
      RPC_PORT: "7777"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
    depends_on:
      - cache

  server3:
    image: ads/server
    environment:
      SERVER_NAME: "server3"
      RPC_PORT: "7777"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
    depends_on:
      - cache

  load_balancer:
    image: ads/load_balancer
    build:
      context: .
      dockerfile: load_balancer.Dockerfile
    environment:
      LB_NAME: "load_balancer"
      SERVERS: "server1:7777,server2:7777,server3:7777"
      BIND_PORT: "7777"
    depends_on:
      - server1
      - server2
      - server3

  client:
    image: ads/client
    build:
      context: .
      dockerfile: client.Dockerfile
    environment:
      CLIENT_NAME: "client"
      LOAD_BALANCER_HOST: "load_balancer"
      LOAD_BALANCER_PORT: "7777"
    depends_on:
      - load_balancer

  cache:
    image: redis:latest
    environment:
      REDIS_ARGS: "--protected-mode no"
