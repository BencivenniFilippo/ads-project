services:
  server:
    image: ads/server
    build:
      context: .
      dockerfile: server.Dockerfile
    environment:
      SERVER_NAME: "server"
      RPC_PORT: "7777"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.create_connection(('127.0.0.1', 7777), 2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  client:
    image: ads/client
    build:
      context: .
      dockerfile: client.Dockerfile
    environment:
      CLIENT_NAME: "client"
      LOAD_BALANCER_HOST: "server"
      LOAD_BALANCER_PORT: "7777"

  cache:
    image: redis:latest
    environment:
      REDIS_ARGS: "--protected-mode no"
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 10s
